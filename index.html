          section: 'Chapter 3: Formation of Sub-Units (SUs) and Hamlet-Groups',

        }
      },
      {
        id: 'q3',
        question: 'Which sector carries the single highest individual weighting in India’s Index of Eight Core Industries (Base 2011-12)?',
        options: [
          { key: 'A', text: 'Refinery Products (28.04% within Core Index)' },
          { key: 'B', text: 'Electricity Generation (19.85%)' },
          { key: 'C', text: 'Steel Production (17.92%)' },
          { key: 'D', text: 'Coal Mining (10.33%)' }
        ],
        correct: 'A',
        explanation: 'Refinery Products holds the highest weight in the Eight Core Industries (28.04%), which altogether comprise 40.27% of the total IIP.',
        citation: {
          manual: 'Index of Industrial Production (IIP Base 2011-12) Compilation Manual',

    // --- MAIN APP COMPONENT ---
    function App() {
      const [users] = useState(INITIAL_USERS);
      const [currentUserId, setCurrentUserId] = useState('usr_iss_001');
      const [userLevels, setUserLevels] = useState(INITIAL_USER_LEVELS);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [manuals, setManuals] = useState(INITIAL_MANUALS);
      const [courses] = useState(INITIAL_IGOT_COURSES);
      
      // APAR Status
      const [aparSynced, setAparSynced] = useState(false);
      const [aparTxHash, setAparTxHash] = useState('0x8fbc72a19e34c990b7e2129e9841');
      const [isSyncing, setIsSyncing] = useState(false);
      const [notification, setNotification] = useState(null);

      // Quiz & Modal States
      const [isQuizModalOpen, setIsQuizModalOpen] = useState(false);
      const [activeQuiz, setActiveQuiz] = useState(null);
      const [currentQIdx, setCurrentQIdx] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [quizResults, setQuizResults] = useState(null);
      const [isAparModalOpen, setIsAparModalOpen] = useState(false);

      // StatBot Chat
      const [isStatBotOpen, setIsStatBotOpen] = useState(false);
      const [chatInput, setChatInput] = useState('');
      const [chatMessages, setChatMessages] = useState([
        { id: '1', sender: 'bot', text: 'Namaste! I am StatBot AI. Ask me about CPI elementary aggregation, NSSO multi-stage sampling designs, IIP weighting matrices, or official FRAC competencies.', time: 'Now' }
      ]);
      const [chatLoading, setChatLoading] = useState(false);

      const currentUser = users.find(u => u.id === currentUserId) || users[0];
      const currentScores = userLevels[currentUserId] || {};

      // Compute Skill Readiness Index (SRI %)
      let totalReq = 0;
      let totalAchieved = 0;
      let verifiedCount = 0;

      const gapTableData = INITIAL_COMPETENCIES.map(comp => {
        const cur = currentScores[comp.id] || 1;
        const req = comp.required;
        const gap = Math.max(0, req - cur);
        const isVerified = cur >= req;
        if (isVerified) verifiedCount++;
        totalReq += req;
        totalAchieved += Math.min(cur, req);
        return {
          ...comp,
          current: cur,
          gap,
          isVerified,
          readinessPct: Math.round((Math.min(cur, req) / req) * 100)
        };
      });

      const skillReadinessIndex = totalReq > 0 ? Math.round((totalAchieved / totalReq) * 100) : 0;
      const gapCount = INITIAL_COMPETENCIES.length - verifiedCount;

      // Radar Chart Effect via Chart.js
      const radarCanvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (activeTab !== 'dashboard' || !radarCanvasRef.current) return;

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const ctx = radarCanvasRef.current.getContext('2d');
        const labels = INITIAL_COMPETENCIES.map(c => c.name.length > 20 ? c.name.substring(0, 18) + '…' : c.name);
        const currentData = INITIAL_COMPETENCIES.map(c => currentScores[c.id] || 1);
        const requiredData = INITIAL_COMPETENCIES.map(c => c.required);

        chartInstanceRef.current = new Chart(ctx, {
          type: 'radar',
          data: {
            labels,
            datasets: [
              {
                label: 'Current Assessed Level',
                data: currentData,
                backgroundColor: 'rgba(59, 130, 246, 0.35)',
                borderColor: '#3B82F6',
                borderWidth: 2.5,
                pointBackgroundColor: '#3B82F6',
              },
              {
                label: 'Required FRAC Benchmark',
                data: requiredData,
                backgroundColor: 'rgba(15, 23, 42, 0.08)',
                borderColor: '#0F172A',
                borderWidth: 1.5,
                borderDash: [4, 4],
                pointBackgroundColor: '#0F172A',
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              r: {
                min: 0,
                max: 5,
                ticks: { stepSize: 1, color: '#64748B', backdropColor: 'transparent' },
                grid: { color: '#E2E8F0' },
                pointLabels: { color: '#0F172A', font: { size: 10, weight: '600' } }
              }
            },
            plugins: {
              legend: { position: 'top', labels: { color: '#0F172A', font: { size: 11, weight: 'bold' } } }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [activeTab, currentUserId, userLevels]);

      // Handle APAR Passbook Sync
      const handleSyncApar = () => {
        setIsSyncing(true);
        setTimeout(() => {
          setAparSynced(true);
          const newHash = '0x' + Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
          setAparTxHash(newHash);
          setIsSyncing(false);
          setNotification('Successfully synchronized verified FRAC skills to iGOT Karmayogi Passbook & e-APAR Record!');
          confetti({ particleCount: 60, spread: 70, origin: { y: 0.3 } });
          setTimeout(() => setNotification(null), 6000);
        }, 1200);
      };

      // Handle Quiz Submission
      const handleSubmitQuiz = () => {
        let correct = 0;
        SAMPLE_MCQS.forEach(q => {
          if (userAnswers[q.id] === q.correct) correct++;
        });
        const score = Math.round((correct / SAMPLE_MCQS.length) * 100);
        const passed = score >= 70;

        // Upgrade Competency if passed
        if (passed) {
          const compToUpgrade = 'comp_02'; // CPI Laspeyres
          setUserLevels(prev => {
            const userScores = { ...prev[currentUserId] };
            userScores[compToUpgrade] = Math.min(5, (userScores[compToUpgrade] || 1) + 1);
            return { ...prev, [currentUserId]: userScores };
          });
          setAparSynced(false); // Flag pending sync
          confetti({ particleCount: 90, spread: 80, origin: { y: 0.5 } });
        }

        setQuizResults({
          score,
          passed,
          correct,
          total: SAMPLE_MCQS.length
        });
      };

      // Handle StatBot Query
      const handleSendChat = (promptText) => {
        const text = promptText || chatInput;
        if (!text.trim()) return;

        const userMsg = { id: Date.now().toString(), sender: 'user', text, time: 'Now' };
        setChatMessages(prev => [...prev, userMsg]);
        if (!promptText) setChatInput('');
        setChatLoading(true);

        setTimeout(() => {
          let botText = 'MoSPI guidelines require following standardized survey sampling and base-year methodologies.';
          let citation = 'MoSPI Official Methodology Manual';

          const lower = text.toLowerCase();
          if (lower.includes('cpi') || lower.includes('laspeyres') || lower.includes('jevons')) {
            botText = `### MoSPI Consumer Price Index (Base 2012=100) Methodology\n\n1. **Elementary Level**: MoSPI uses the **Jevons Index (Geometric Mean)**:\n   R_i = (∏ P_t,j / P_0,j)^(1/m)\n   This eliminates the upward substitution bias of the Carli index.\n2. **Aggregated Level**: Compiled via Modified Laspeyres using expenditure weights from the NSS 68th Round Consumer Expenditure Survey (CES).\n3. **Quality Adjustment**: Missing quotations mandate overlap pricing to prevent spurious inflation.`;
            citation = 'CPI Base 2012=100 Compilation Guide, Chapter 4, Page 34';
          } else if (lower.includes('nsso') || lower.includes('fsu') || lower.includes('sampling')) {
            botText = `### NSSO Multi-Stage Stratified Sampling Frame\n\n- **Rural First Stage Units (FSUs)**: Census Revenue Villages (Panchayat wards in Kerala).\n- **Urban FSUs**: Urban Frame Survey (UFS) blocks (100–150 households).\n- **Hamlet-Group Formation**: Mandatory when population ≥ 1,200 (rural) or ≥ 1,400 (urban). Exactly 2 sub-units selected.\n- **Households (USUs)**: Selected via circular systematic sampling with equal probability.`;
            citation = 'NSSO 80th Round Survey Manual, Chapter 2, Page 19';
          } else if (lower.includes('iip') || lower.includes('core')) {
            botText = `### Index of Industrial Production (IIP Base 2011-12)\n\n- Sectoral Weights: Manufacturing (77.63%), Mining (14.37%), Electricity (8.00%).\n- **Eight Core Industries**: Constitute **40.27%** of total IIP. Refinery Products has the largest core weight (28.04%), followed by Electricity (19.85%) and Steel (17.92%).`;
            citation = 'IIP Compilation Manual, Chapter 4, Page 28';
          }

          const botMsg = {
            id: (Date.now() + 1).toString(),
            sender: 'bot',
            text: botText,
            citation,
            time: 'Now'
          };
          setChatMessages(prev => [...prev, botMsg]);
          setChatLoading(false);
        }, 600);
      };

      return (
        <div className="min-h-screen flex flex-col bg-sand-100 font-sans">
          
          {/* 1. TOP HEADER & NAVBAR */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slatecool-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-slatenavy-900 flex items-center justify-center text-white font-bold text-xl shadow-md ring-2 ring-electric-500/20">
                  🏛️
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-extrabold text-lg text-slatenavy-900 tracking-tight">

                    </span>
                    <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-300">
                      MoSPI Official
                    </span>
                    <span className="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-electric-100 text-electric-700">
                      Prototype
                    </span>
                  </div>
                  <p className="text-xs text-slatenavy-900/60 font-medium">
                    Integrated with iGOT Karmayogi FRAC Framework
                  </p>
                </div>
              </div>

              {/* Officer Switcher & APAR Badge */}
              <div className="flex items-center space-x-3">
                <button
                  onClick={() => setIsAparModalOpen(true)}
                  className={`hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-semibold border transition-all ${
                    aparSynced
                      ? 'bg-emeralddeep-50 text-emeralddeep-700 border-emeralddeep-200 hover:bg-emeralddeep-100'
                      : 'bg-crimsonsoft-50 text-crimsonsoft-600 border-crimsonsoft-200 hover:bg-crimsonsoft-100'
                  }`}
                >
                  <span className={`w-2 h-2 rounded-full ${aparSynced ? 'bg-emeralddeep-600 animate-pulse' : 'bg-crimsonsoft-600'}`}></span>
                  <span className="font-mono">{currentUser.apar_id}</span>
                  <span>•</span>
                  <span>{aparSynced ? 'iGOT Synced' : `${gapCount} Gaps Pending`}</span>
                </button>

                <div className="flex items-center space-x-2 bg-sand-100 px-3 py-1.5 rounded-lg border border-slatecool-200">
                  <span className="text-xs font-bold text-electric-500">👤</span>
                  <div>
                    <select
                      value={currentUserId}
                      onChange={(e) => {
                        setCurrentUserId(e.target.value);
                        setActiveQuiz(null);
                      }}
                      className="bg-transparent text-xs font-bold text-slatenavy-900 focus:outline-none cursor-pointer"
                    >
                      {users.map(u => (
                        <option key={u.id} value={u.id}>{u.name} ({u.role_title.split('(')[0].trim()})</option>

                      <p className="text-xs text-slate-500 max-w-md mx-auto">
                        Synthesize questions across Bloom's Taxonomy (Remember, Apply, Analyze) directly from MoSPI official survey manuals and statistical guidelines.
                      </p>
                      <button
                        onClick={() => {
                          setActiveQuiz(SAMPLE_MCQS);
                          setCurrentQIdx(0);
                          setUserAnswers({});
                          setQuizResults(null);
                        }}
                        className="px-5 py-2.5 rounded-xl bg-electric-500 text-white text-xs font-bold hover:bg-electric-600 shadow-hover"
                      >
                        Launch 3-Question Assessment Sprint
                      </button>
                    </div>
                  )}

                </div>
              )}

              {/* MODULE C: iGOT KARMAYOGI RECOMMENDER ENGINE */}
              {activeTab === 'recommender' && (
                <div className="space-y-6 animate-fadeIn">
                  <div className="bg-white rounded-xl p-6 border border-slatecool-200 shadow-card flex items-center justify-between">
                    <div>
                      <div className="text-xs font-bold text-electric-600 uppercase tracking-wider">Karmayogi Bharat Course Recommendation Engine</div>
                      <h2 className="text-base font-bold text-slatenavy-900">Semantic Skill Gap Matching ({courses.length} Courses Found)</h2>
                      <p className="text-xs text-slate-500">Matched against your missing FRAC competencies and official cadre targets</p>
                    </div>
                    <button
                      onClick={handleSyncApar}
                      className="px-4 py-2 rounded-xl bg-slatenavy-900 text-white text-xs font-bold hover:bg-slatenavy-800"
                    >
                      Sync Passbook to APAR
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {courses.map(course => (
                      <div key={course.id} className="bg-white rounded-xl border border-slatecool-200 p-5 shadow-card flex flex-col justify-between hover:border-electric-500 transition-all group">
                        <div>
                          <div className="flex items-center justify-between mb-2">
                            <span className="px-2 py-0.5 rounded-full text-xs font-bold bg-electric-50 text-electric-600 border border-electric-200">
                              ★ {course.match}% Semantic Match
                            </span>
                            <span className="text-[11px] font-mono text-slate-500 bg-sand-100 px-2 py-0.5 rounded border border-slatecool-200">
                              {course.code}
                            </span>
                          </div>
                          <h4 className="text-sm font-bold text-slatenavy-900 group-hover:text-electric-600 transition-colors leading-snug">
                            {course.title}
                          </h4>
                          <p className="text-xs text-slate-500 mt-1">Offered by: <strong>{course.provider}</strong></p>
                        </div>

                        <div className="mt-4 pt-3 border-t border-slatecool-200">
                          <div className="flex items-center justify-between text-xs text-slate-500 mb-3">
                            <span>⏱️ {course.mins} mins</span>
                            <span>⭐ {course.rating}</span>
                            <span className="font-semibold text-slatenavy-900">Target: Level {course.target}</span>
                          </div>
                          <button
                            onClick={() => alert(`Enrolled in ${course.title} on iGOT Karmayogi Bharat!`)}
                            className="w-full py-2 rounded-lg bg-electric-500 text-white text-xs font-bold hover:bg-electric-600 transition-colors shadow-sm"
                          >
                            Enroll on iGOT
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* MODULE D: ADMIN & ZONAL CAPACITY ANALYTICS */}
              {activeTab === 'analytics' && (
                <div className="space-y-6 animate-fadeIn">
                  <div className="bg-white rounded-xl p-5 border border-slatecool-200 shadow-card flex items-center justify-between">
                    <div>
                      <h2 className="text-base font-bold text-slatenavy-900">MoSPI Training Directorate: Zonal Capacity Analytics</h2>
                      <p className="text-xs text-slate-500">National overview across North, East, South, West, and Central headquarters</p>
                    </div>
                    <button
                      onClick={() => setIsAparModalOpen(true)}
                      className="px-4 py-2 rounded-xl bg-slatenavy-900 text-white text-xs font-bold hover:bg-slatenavy-800"
                    >
                      Export APAR Dossier
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {[
                      { zone: 'North Zone - New Delhi', hq: 'Sardar Patel Bhawan', count: 420, readiness: 78.4, topGap: 'Python & R for Microdata', sync: 92.5 },
                      { zone: 'East Zone - Kolkata', hq: 'Mahalanobis Bhavan', count: 380, readiness: 71.2, topGap: 'CPI Laspeyres Indexation', sync: 84.0 },
                      { zone: 'South Zone - Bengaluru', hq: 'Kendriya Sadan', count: 340, readiness: 82.6, topGap: 'SNA 2008 & SUT Tables', sync: 95.8 },
                      { zone: 'West Zone - Mumbai', hq: 'CGO Complex Belapur', count: 310, readiness: 76.0, topGap: 'CAPI Digital Instruments', sync: 88.2 },
                      { zone: 'Central Zone - Bhopal', hq: 'Paryavaran Parisar', count: 220, readiness: 68.5, topGap: 'Python & R for Microdata', sync: 79.0 }
                    ].map(z => (
                      <div key={z.zone} className="bg-white rounded-xl p-4 border border-slatecool-200 shadow-card">
                        <div className="flex items-start justify-between">
                          <div>
                            <h4 className="font-bold text-sm text-slatenavy-900">{z.zone}</h4>
                            <div className="text-[11px] text-slate-500">HQ: {z.hq}</div>
                          </div>
                          <span className="text-xs font-mono font-bold bg-sand-100 px-2 py-0.5 rounded border border-slatecool-200">
                            {z.count} Officers
                          </span>
                        </div>
                        <div className="mt-3">
                          <div className="flex justify-between text-xs font-semibold mb-1">
                            <span>Readiness</span>
                            <span>{z.readiness}%</span>
                          </div>
                          <div className="h-2 w-full bg-slatecool-200 rounded-full overflow-hidden">
                            <div className="h-full bg-electric-500" style={{ width: `${z.readiness}%` }}></div>
                          </div>
                        </div>
                        <div className="mt-3 pt-2 border-t border-slatecool-200 text-xs">
                          <span className="text-slate-500 text-[11px]">Primary Training Gap:</span>
                          <div className="font-bold text-crimsonsoft-600">⚠️ {z.topGap}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* OFFICIAL MANUALS LIBRARY */}
              {activeTab === 'manuals' && (
                <div className="space-y-6 animate-fadeIn">
                  <div className="bg-white rounded-xl p-6 border border-slatecool-200 shadow-card">
                    <h2 className="text-base font-bold text-slatenavy-900 mb-1">Indexed MoSPI Official Statistical Manuals</h2>
                    <p className="text-xs text-slate-500 mb-4">Official procedural guides pre-loaded and ready for RAG question synthesis</p>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {manuals.map(m => (
                        <div key={m.id} className="p-4 rounded-xl border border-slatecool-200 bg-sand-50/40 flex flex-col justify-between">
                          <div>
                            <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-sand-200 text-slatenavy-900">{m.category}</span>
                            <h4 className="font-bold text-sm text-slatenavy-900 mt-2">{m.title}</h4>
                            <div className="text-xs text-slate-500 mt-1">{m.pages} pages • {m.size}</div>
                          </div>
                          <div className="mt-4 pt-2 border-t border-slatecool-200 flex items-center justify-between">
                            <span className="font-mono text-[10px] text-slate-400">ns: {m.ns}</span>
                            <button
                              onClick={() => {
                                setActiveQuiz(SAMPLE_MCQS);
                                setCurrentQIdx(0);
                                setUserAnswers({});
                                setQuizResults(null);
                                setActiveTab('assessment');
                              }}
                              className="text-xs font-bold text-electric-600 hover:text-electric-700"
                            >
                              Generate MCQs →
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* 3. FLOATING STATBOT ASSISTANT (MODULE E) */}
          <div className="fixed bottom-6 right-6 z-50">
            {!isStatBotOpen ? (
              <button
                onClick={() => setIsStatBotOpen(true)}
                className="flex items-center space-x-2 bg-slatenavy-900 text-white px-4 py-3 rounded-full shadow-2xl hover:bg-slatenavy-800 transition-all border border-slatecool-300 ring-4 ring-electric-500/20"
              >
                <span className="text-lg">🤖</span>
                <div className="text-left">
                  <div className="text-xs font-bold">StatBot AI</div>
                  <div className="text-[10px] text-slate-400">Statistical Assistant</div>
                </div>
              </button>
            ) : (
              <div className="bg-white rounded-2xl w-[360px] sm:w-[420px] h-[520px] border border-slatecool-200 shadow-2xl flex flex-col overflow-hidden animate-fadeIn">
                <div className="bg-slatenavy-900 text-white p-3.5 flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <span className="text-lg">🤖</span>
                    <div>
                      <div className="text-xs font-bold">StatBot Methodology Assistant</div>
                      <div className="text-[10px] text-slate-400">RAG MoSPI Knowledge Base</div>
                    </div>
                  </div>
                  <button onClick={() => setIsStatBotOpen(false)} className="text-slate-400 hover:text-white text-sm font-bold">✕</button>
                </div>

                {/* Quick Prompts */}
                <div className="p-2 bg-sand-50 border-b border-slatecool-200 flex overflow-x-auto gap-1 text-[10px]">
                  {['CPI Jevons vs Carli', 'NSSO FSU protocol', 'Core Industries weights'].map(p => (
                    <button
                      key={p}
                      onClick={() => handleSendChat(p)}
                      className="whitespace-nowrap px-2 py-0.5 rounded-full bg-white border border-slatecool-200 hover:border-electric-500 text-slatenavy-900"
                    >
                      {p}
                    </button>
                  ))}
                </div>

                {/* Messages */}
                <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs bg-sand-50/30">
                  {chatMessages.map(m => (
                    <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                      <div className={`p-3 rounded-2xl max-w-[88%] leading-relaxed ${
                        m.sender === 'user' ? 'bg-electric-500 text-white' : 'bg-white border border-slatecool-200 text-slatenavy-900 shadow-sm'
                      }`}>
                        <div className="whitespace-pre-wrap">{m.text}</div>
                        {m.citation && (
                          <div className="mt-2 pt-1.5 border-t border-slatecool-100 text-[10px] text-electric-700 font-semibold">
                            📖 {m.citation}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                  {chatLoading && <div className="text-xs text-slate-400">StatBot is retrieving citations...</div>}
                </div>

                {/* Input */}
                <form onSubmit={(e) => { e.preventDefault(); handleSendChat(); }} className="p-2 bg-white border-t border-slatecool-200 flex items-center space-x-2">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="Ask statistical methodology question..."
                    className="flex-1 text-xs px-3 py-2 rounded-xl border border-slatecool-200 bg-sand-50/50 text-slatenavy-900 focus:outline-none"
                  />
                  <button type="submit" className="p-2 rounded-xl bg-electric-500 text-white hover:bg-electric-600 text-xs font-bold">
                    Send
                  </button>
                </form>
              </div>
            )}
          </div>

          {/* 4. APAR EXPORT MODAL */}
          {isAparModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slatenavy-900/70 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white rounded-2xl max-w-2xl w-full border border-slatecool-200 shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
                <div className="bg-slatenavy-900 text-white p-4 flex items-center justify-between">
                  <div>
                    <h3 className="text-sm font-bold">Official MoSPI e-APAR Competency Dossier</h3>
                    <p className="text-[11px] text-slate-300">iGOT Karmayogi FRAC Compliance Verification</p>
                  </div>
                  <button onClick={() => setIsAparModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="p-6 overflow-y-auto space-y-4 text-xs">
                  <div className="text-center border-b border-slatecool-200 pb-3">
                    <div className="text-2xl">🏛️</div>
                    <h2 className="text-sm font-extrabold uppercase">Government of India</h2>
                    <h3 className="text-xs font-bold text-slate-600">Ministry of Statistics and Programme Implementation</h3>
                    <div className="text-[10px] font-mono text-slate-400 mt-1">Dossier ID: MOSPI-APAR-{currentUser.apar_id}-2025</div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 bg-sand-50 p-3 rounded-lg border border-slatecool-200">
                    <div>Officer: <strong>{currentUser.name}</strong></div>
                    <div>Cadre: <strong>{currentUser.role_title}</strong></div>
                    <div>Zone: <strong>{currentUser.zone}</strong></div>
                    <div>APAR ID: <strong className="text-electric-600">{currentUser.apar_id}</strong></div>
                    <div>Readiness Index: <strong className="text-emeralddeep-700">{skillReadinessIndex}%</strong></div>
                    <div>Status: <strong>{aparSynced ? 'SYNCHRONIZED' : 'PENDING'}</strong></div>
                  </div>

                  <div>
                    <h4 className="font-bold uppercase text-[10px] text-slate-500 mb-1">Competency Compliance Audit</h4>
                    <div className="border border-slatecool-200 rounded-lg overflow-hidden">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slatecool-100 font-bold text-[10px]">
                          <tr>
                            <th className="p-2">Competency</th>
                            <th className="p-2 text-center">Assessed</th>
                            <th className="p-2 text-center">Benchmark</th>
                            <th className="p-2 text-right">Status</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slatecool-200">
                          {gapTableData.map(c => (
                            <tr key={c.id}>
                              <td className="p-2 font-medium">{c.name}</td>
                              <td className="p-2 text-center font-bold">L{c.current}</td>
                              <td className="p-2 text-center text-slate-500">L{c.required}</td>
                              <td className="p-2 text-right">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                  c.isVerified ? 'bg-emeralddeep-50 text-emeralddeep-700' : 'bg-crimsonsoft-50 text-crimsonsoft-600'
                                }`}>
                                  {c.isVerified ? 'VERIFIED' : 'GAP'}
                                </span>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slatecool-200 flex items-center justify-between text-[11px] text-slate-500">
                    <div>Digital Stamp: <span className="font-mono">{aparTxHash.slice(0, 24)}...</span></div>
                    <div>Certified by: <strong>Joint Secretary (Training), MoSPI HQ</strong></div>
                  </div>
                </div>

                <div className="bg-sand-50 p-3 border-t border-slatecool-200 flex justify-end space-x-2">
                  <button onClick={() => setIsAparModalOpen(false)} className="px-3 py-1.5 rounded-lg border border-slatecool-300 text-xs">Close</button>
                  <button onClick={() => window.print()} className="px-4 py-1.5 rounded-lg bg-electric-500 text-white text-xs font-bold hover:bg-electric-600">Print Dossier</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
